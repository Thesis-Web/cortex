# .github/workflows/nostar.yml (2026-11-11, the auditor, on the owner's order): no code for the brain outside the brain, on every push.
# The owner, 11-11: "make ci/cd in the git such these stars cannot ever be done again ... make it impossible to build it wrong".
# Each push is held against the commit before it: outside ci/ and .github/ no code file may be added and none may grow (ci/nostar).
# The gate that judges a push is the one from BEFORE the push, so a push cannot loosen its own gate; a push that changes the gate
# or this workflow fails here and shows red, for the owner to see.
name: no-star
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  nostar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no code file added, none grew
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          set -e
          B="$BEFORE"
          if [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$B^{commit}" 2>/dev/null; then B=$(git rev-parse HEAD~1); fi
          echo "held against $B"
          mkdir -p /tmp/old /tmp/new
          git archive "$B" | tar -x -C /tmp/old
          git archive HEAD | tar -x -C /tmp/new
          GATE=/tmp/new/ci/nostar; [ -f /tmp/old/ci/nostar ] && GATE=/tmp/old/ci/nostar
          python3 "$GATE" /tmp/old /tmp/new
          if [ -f /tmp/old/ci/nostar ]; then
            for f in ci/nostar .github/workflows/nostar.yml; do
              cmp -s "/tmp/old/$f" "/tmp/new/$f" || { echo "NO-STAR GATE: FAIL - $f was changed by this push. Only the owner's auditor changes the gate; the owner sees this red mark."; exit 1; }
            done
          fi
